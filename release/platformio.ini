; Build:  pio run  ->  .pio/build/leonardo/firmware.hex
; Ship it as rodgers_890_v0.hex (the web flasher accepts any .hex).
[platformio]
src_dir = ../src/main/rodgers_890_v0

[env:leonardo]
platform = atmelavr
board = leonardo
framework = arduino
; USB device/MIDI port name — the Caterina bootloader keeps its own
; "Arduino Leonardo" string, so the sketch and the bootloader port are
; distinguishable in the browser port picker.
board_build.usb_product = Rodgers 890
lib_deps = arduino-libraries/MIDIUSB@^1.0.5
